<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
        }
        .login-box {
            width: 420px;
            padding: 36px 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
        }
        h1 { text-align: center; margin-bottom: 8px; color: #0f172a; }
        .subtitle { text-align: center; color: #475569; margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; }
        input, select {
            width: 100%; padding: 12px 14px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 12px; margin-top: 16px; }
        .demo { margin-top: 18px; font-size: 13px; color: #475569; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Smart Attendance</h1>
        <p class="subtitle">Attendance Management System</p>

        <form method="POST" action="/login">
            <label for="identifier">Email / Student ID</label>
            <input type="text" id="identifier" name="identifier" placeholder="admin@college.edu or IT26-023" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <label for="role">Login As</label>
            <select id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="faculty">Faculty</option>
                <option value="student">Student</option>
            </select>

            <button type="submit">Login</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="demo">
            Demo credentials: admin@college.edu / admin123<br>
            faculty@college.edu / faculty123<br>
            IT26-023 / student123
        </div>
    </div>
</body>
</html>
