<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Edit Student</h2>

    <form method="POST"
          action="/update-student/{{ student['id'] }}">

        <label>Name</label>
        <input type="text"
               name="name"
               value="{{ student['name'] }}"
               required>


        <label>Roll Number</label>
        <input type="text"
               name="roll_no"
               value="{{ student['roll_no'] }}"
               required>


        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ student['email'] }}"
               required>


        <label>Division</label>
        <input type="text"
               name="division"
               value="{{ student['division'] }}"
               required>


        <label>Department</label>
        <input type="text"
               name="department"
               value="{{ student['department'] }}"
               required>


        <label>Semester</label>
        <input type="number"
               name="semester"
               value="{{ student['semester'] }}"
               required>


        <button type="submit">
            Update Student
        </button>

    </form>

    <a href="/students">
        ← Back to Students
    </a>

</div>

</body>

</html>
