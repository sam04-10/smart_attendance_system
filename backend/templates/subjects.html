<!DOCTYPE html>
<html>

<head>

    <title>Subject Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px #ddd;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 25%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px #ddd;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
        }

        .edit-btn {
            background: #16a34a;
        }

        a {
            text-decoration: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>Subject Management</h1>


    <!-- ADD SUBJECT -->

    <div class="form-box">

        <h2>Add Subject</h2>

        <form method="POST"
              action="/add-subject">


            <input
                type="text"
                name="subject_name"
                placeholder="Subject Name"
                required
            >


            <input
                type="text"
                name="subject_code"
                placeholder="Subject Code"
                required
            >


            <input
                type="text"
                name="faculty_name"
                placeholder="Faculty Name"
                required
            >


            <button type="submit">
                Add Subject
            </button>

        </form>

    </div>


    <!-- SUBJECT LIST -->

    <h2>All Subjects</h2>


    <table>

        <tr>

            <th>ID</th>

            <th>Subject Name</th>

            <th>Subject Code</th>

            <th>Faculty</th>

            <th>Action</th>

        </tr>


        {% for subject in subjects %}

        <tr>

            <td>
                {{ subject['id'] }}
            </td>


            <td>
                {{ subject['subject_name'] }}
            </td>


            <td>
                {{ subject['subject_code'] }}
            </td>


            <td>
                {{ subject['faculty_name'] }}
            </td>


            <td>

                <a href="/edit-subject/{{ subject['id'] }}">

                    <button
                        type="button"
                        class="edit-btn"
                    >
                        Edit
                    </button>

                </a>


                <form
                    method="POST"
                    action="/delete-subject/{{ subject['id'] }}"
                    style="display:inline;"
                >

                    <button
                        type="submit"
                        class="delete-btn"
                    >
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}


    </table>


    <a
        href="/admin-dashboard"
        class="back-link"
    >
        ← Back to Admin Dashboard
    </a>


</div>


</body>

</html>
